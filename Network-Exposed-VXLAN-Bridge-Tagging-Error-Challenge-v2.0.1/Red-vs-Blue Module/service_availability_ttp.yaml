id: Network-Exposed-VXLAN-Bridge-Tagging-Error-Service-Availability
name: Network-Exposed-VXLAN-Bridge-Tagging-Error-Service-Availability
description: Validates challenge availability using one inline command.
tactic: execution
technique_id: T1059
technique_name: Command and Scripting Interpreter
tag: service-availability
executors:
  - name: sh
    platform: linux
    command: >-
      sudo bash -lc 'set -Eeuo pipefail; E=$(find /opt /home /root -path "*/Network-Exposed-VXLAN-Bridge-Tagging-Error-Challenge*/Red-vs-Blue Module/runtime/lab.env" -type f 2>/dev/null | head -n1); [ -n "$E" ] && . "$E"; ip -d link show "$BR" | grep -q "vlan_filtering 1"; ip -d link show "$VXLAN_PORT" | grep -Eq "vxlan id ${VXLAN_VNI}([[:space:]]|$)"; bridge vlan show dev "$VXLAN_PORT" | grep -Eq "(^|[[:space:]])10[[:space:]].*PVID.*Egress Untagged"; bridge vlan show dev "$VXLAN_PORT" | grep -Eq "(^|[[:space:]])30([[:space:]]|$)"; curl -fsS "http://${EXT_IP}:8088/backup.conf" | grep -q "VXLAN_VNI=200"; ip netns exec "$WORK_NS" curl -fsS "http://${WORK_IP}:8080/network-note" | grep -q "VLAN 30"; ip netns exec "$ADMIN_NS" curl -fsS "http://${MGMT_IP}:8080/" | grep -q "FLAG{linux_bridge_tagged_vlan_bypass}"; echo SERVICE_STATUS:UP'
    payloads: []
    parsers: []
